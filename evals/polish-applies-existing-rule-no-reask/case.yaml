schema_version: "1.1"
name: polish-applies-existing-rule-no-reask
plugins: ["../.."]
runs: 3
description: >
  When .tardis/polish/ruby.md already has a matching rule, polish must
  not re-ask for a bad/good example — it applies the rule and shows a
  one-shot summary asking for batch approval.

execution:
  model: claude-sonnet-5
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob]

context:
  scaffold_script: seed-repo.sh

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?polish"'
  - name: does-not-ask-for-examples
    type: regex
    pattern: "(?=.*bad)(?=.*good)"
    flags: is
    match: not_contains
    target: last_message
  - name: proposes-early-return
    type: regex
    pattern: "return unless"
    target: last_message
