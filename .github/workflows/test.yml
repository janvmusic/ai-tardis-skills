name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Matches the version publish-npm.yml builds with. The suite needs
      # Node 18+ for node:test; the published CLI still supports Node 14+.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the package has no dependencies, runtime or dev.
      - name: Run tests
        run: npm test
