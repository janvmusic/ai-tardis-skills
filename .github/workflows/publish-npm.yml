name: Publish to npm

on:
  # Runs after "Update Github Version" cuts a release. A tag created by that
  # workflow's GITHUB_TOKEN cannot trigger a `push: tags` run (GitHub suppresses
  # events made with the default token), so the chain is explicit instead.
  workflow_run:
    workflows: ["Update Github Version"]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    # Skip when the upstream release workflow failed; the other triggers always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.check.outputs.published }}

    steps:
      # A tag push publishes that tag; every other trigger publishes main.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # "Update Github Version" completes on every push to main, including the
      # formula bump this workflow pushes itself. Without this guard those runs
      # would retry an already-published version and fail.
      - name: Check whether this version is already on npm
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if npm view "ai-tardis-skills@$version" version >/dev/null 2>&1; then
            echo "ai-tardis-skills@$version is already on npm — nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "ai-tardis-skills@$version is not on npm — publishing"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update npm to a trusted-publishing version
        if: steps.check.outputs.published == 'true'
        run: npm install -g npm@latest

      - name: Publish
        if: steps.check.outputs.published == 'true'
        run: npm publish

  bump-formula:
    # Deliberately not gated on `published` — this runs whenever the publish job
    # succeeded, including when it no-opped because the version was already on
    # npm. That makes the formula self-healing: if a previous run published but
    # never got a merged bump, re-running opens a fresh PR. When the formula is
    # already current the job no-ops at the "Open PR" step.
    #
    # main is ruleset-protected (2 required status checks), so GITHUB_TOKEN
    # can't push to it directly — this opens a PR instead. That PR is also
    # opened with a PAT (RELEASE_PR_TOKEN), not GITHUB_TOKEN: GitHub does not
    # fire pull_request_target for events made with the default token, so the
    # required "Validate PR title" check would never run and the PR would be
    # permanently stuck. A PAT-authored PR is treated like any human's.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # The formula tracks the published tarball, so it can only be updated
      # after the publish job succeeds. Commits land on main, not the tag.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Download tarball and compute sha256
        id: tarball
        run: |
          version="${{ needs.publish.outputs.version }}"
          url="https://registry.npmjs.org/ai-tardis-skills/-/ai-tardis-skills-${version}.tgz"

          # The registry can lag a few seconds behind a successful publish.
          for attempt in $(seq 1 30); do
            if curl -sfL "$url" -o package.tgz; then
              break
            fi
            echo "Tarball not available yet (attempt $attempt) — retrying in 10s"
            sleep 10
          done

          if [ ! -s package.tgz ]; then
            echo "::error::$url never became available"
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum package.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          sed -i -E \
            -e 's|^  url ".*"|  url "${{ steps.tarball.outputs.url }}"|' \
            -e 's|^  sha256 ".*"|  sha256 "${{ steps.tarball.outputs.sha256 }}"|' \
            Formula/tardis-ai.rb
          rm -f package.tgz
          git diff -- Formula/tardis-ai.rb

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          version="${{ needs.publish.outputs.version }}"

          if git diff --quiet -- Formula/tardis-ai.rb; then
            echo "Formula already points at v$version — nothing to commit"
            exit 0
          fi

          branch="chore/bump-formula-v$version"
          if gh pr list --state open --head "$branch" --json number --jq 'length' | grep -qv '^0$'; then
            echo "A bump PR for v$version is already open — nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/tardis-ai.rb
          git commit -m "chore: bump homebrew formula to v$version"
          git push origin "$branch"

          gh pr create \
            --title "chore: bump homebrew formula to v$version" \
            --body "Bumps \`Formula/tardis-ai.rb\` to the tarball and sha256 published for v$version. Opened as a PR because main's ruleset requires status checks that a direct bot push can't satisfy." \
            --base main \
            --head "$branch"
